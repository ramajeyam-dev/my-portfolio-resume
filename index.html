<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S. Ramajeyam | UI/UX Designer</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --text:#e8eaf0; --muted:#9aa3b2; --accent:#5b9dff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
  .wrap { max-width:760px; margin:0 auto; padding:0 20px; }
  header { padding:72px 0 48px; }
  .tag { color:var(--accent); font-weight:600; letter-spacing:.5px; font-size:.9rem; }
  h1 { font-size:2.4rem; margin:8px 0 12px; line-height:1.2; }
  header p { color:var(--muted); font-size:1.05rem; max-width:560px; }
  .btns { margin-top:24px; display:flex; gap:12px; flex-wrap:wrap; }
  .btn { padding:10px 20px; border-radius:10px; text-decoration:none; font-weight:600; border:1px solid var(--accent); color:var(--accent); }
  .btn.primary { background:var(--accent); color:#0b0d12; }
  section { padding:32px 0; border-top:1px solid #23272f; }
  h2 { font-size:1.4rem; margin-bottom:16px; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; }
  .chip { background:var(--card); padding:8px 14px; border-radius:999px; font-size:.95rem; border:1px solid #262b35; }
  .card { background:var(--card); border:1px solid #262b35; border-radius:14px; padding:20px; margin-bottom:16px; }
  .card h3 { margin-bottom:4px; }
  .meta { color:var(--muted); font-size:.9rem; margin-bottom:8px; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  a { color:var(--accent); }
  footer { padding:32px 0 56px; color:var(--muted); font-size:.9rem; text-align:center; border-top:1px solid #23272f; }
</style>
</head>
<body>
